<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Classes – EduManager</title>
  <link rel="icon" type="image/png" href="..//img/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="/css/vendor/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/vendor/all.min.css" rel="stylesheet"/>
  <link href="../css/dashboard.css" rel="stylesheet"/>
  <link rel="manifest" href="../manifest.json" />
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<header class="topbar" id="topbar">
  <button class="topbar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div class="topbar-search"><i class="fas fa-search"></i><input type="text" placeholder="Rechercher une classe…"/></div>
  <div class="topbar-actions"><button class="topbar-btn"><i class="fas fa-bell"></i><span class="notif-dot"></span></button><div class="topbar-divider"></div><div class="user-av" style="cursor:pointer">D</div></div>
</header>
<main class="main-content" id="mainContent">
  <div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <h1 class="page-title">Classes</h1>
      <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="">Accueil</a></li><li class="breadcrumb-item active">Classes</li></ol></nav>
    </div>
    <button class="btn btn-primary btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#addClasseModal"><i class="fas fa-plus me-1"></i>Nouvelle classe</button>
  </div>

  <!-- KPIs -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3"><div class="stat-card"><div class="sc-icon bg-primary-soft mb-2"><i class="fas fa-door-open text-primary"></i></div><div class="sc-value">0</div><div class="sc-label">Classes actives</div></div></div>
    <div class="col-6 col-md-3"><div class="stat-card"><div class="sc-icon bg-success-soft mb-2"><i class="fas fa-users text-success"></i></div><div class="sc-value">0</div><div class="sc-label">Élèves au total</div></div></div>
    <div class="col-6 col-md-3"><div class="stat-card"><div class="sc-icon bg-warning-soft mb-2"><i class="fas fa-user-tie text-warning"></i></div><div class="sc-value">0</div><div class="sc-label">Moy. élèves/classe</div></div></div>
    <div class="col-6 col-md-3"><div class="stat-card"><div class="sc-icon bg-info-soft mb-2"><i class="fas fa-layer-group text-info"></i></div><div class="sc-value">0</div><div class="sc-label">Niveaux scolaires</div></div></div>
  </div>

  <!-- Grille classes par niveau -->
  <div id="classesContainer">
    <!-- Données dynamiques -->
  </div>

  <!-- Modal nouvelle classe -->
<div class="modal fade" id="addClasseModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title fw-bold"><i class="fas fa-door-open text-primary me-2"></i>Créer une classe</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Nom de la classe *</label><input type="text" name="nom" class="form-control" placeholder="Ex: 5ème A"/></div>
        <div class="col-md-6"><label class="form-label">Niveau *</label><select name="niveau" class="form-select"><option>6ème</option><option>5ème</option><option>4ème</option><option>3ème</option><option>2nde</option><option>1ère</option><option>Terminale</option></select></div>
        <div class="col-md-6"><label class="form-label">Salle</label><input type="text" name="salle" class="form-control" placeholder="Ex: Salle 5"/></div>
        <div class="col-md-6"><label class="form-label">Capacité max</label><input type="number" name="capacite" class="form-control" value="48"/></div>
        <div class="col-12"><label class="form-label">Professeur principal</label><select name="enseignant_principal_id" id="profPrincipalSelect" class="form-select"><option value="">Sélectionner un professeur...</option></select></div>
      </div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Annuler</button><button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold">Créer la classe</button></div>
  </div></div>
</div>

<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="../js/dashboard.js"></script>
<script>
</script>


<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
  <script src="../js/security.js"></script>
  <script src="../js/sidebar.js"></script>
</body>
</html>
