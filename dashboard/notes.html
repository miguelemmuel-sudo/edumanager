<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Notes & Bulletins – EduManager</title>
  <link rel="icon" type="image/png" href="..//img/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="/css/vendor/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/vendor/all.min.css" rel="stylesheet"/>
  <link href="../css/dashboard.css" rel="stylesheet"/>
  <style>
    .excel-input {
      border: 1px solid transparent;
      background: transparent;
      width: 100%;
      text-align: center;
      font-weight: 500;
      padding: 4px;
      transition: all 0.2s;
    }
    .excel-input:focus {
      border-color: var(--primary);
      background: #fff;
      outline: none;
      box-shadow: 0 0 0 0.2rem rgba(37,99,235,.25);
      border-radius: 4px;
    }
    .excel-input.dirty {
      background-color: #fff3cd;
      border-color: #ffc107;
    }
    .col-note {
      width: 80px;
    }
  </style>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<header class="topbar" id="topbar">
  <button class="topbar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div class="topbar-search"><i class="fas fa-search"></i><input type="text" placeholder="Rechercher…"/></div>
  <div class="topbar-actions">
    <div id="syncStatusIndicator" class="me-3 d-flex align-items-center"></div><button class="topbar-btn"><i class="fas fa-bell"></i><span class="notif-dot"></span></button><div class="topbar-divider"></div><div class="user-av" style="cursor:pointer">D</div></div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <h1 class="page-title">Saisie des Notes</h1>
      <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="">Accueil</a></li><li class="breadcrumb-item active">Notes</li></ol></nav>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="openBulletinsInterface()"><i class="fas fa-file-alt me-1"></i>Génération des Bulletins</button>
    </div>
  </div>

  <!-- Sélecteur Classe / Matière / Période -->
  <div class="dash-card mb-4 p-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Classe</label>
        <select class="form-select" id="selClasse" onchange="onClasseChange()">
          <option value="">Sélectionner une classe</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Matière</label>
        <select class="form-select" id="selMatiere" disabled>
          <option value="">Sélectionner une classe d'abord</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Période d'évaluation</label>
        <select class="form-select" id="selPeriode">
          <option value="">Chargement...</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100 rounded-pill" onclick="chargerGrille()">Afficher la grille</button>
      </div>
    </div>
  </div>

  <!-- Grille de saisie type Excel -->
  <div class="dash-card d-none" id="gridContainer">
    <div class="dash-card-header d-flex justify-content-between align-items-center">
      <span class="dash-card-title" id="gridTitle"><i class="fas fa-table text-primary me-2"></i>Grille de notes</span>
      <div class="d-flex gap-2">
        <span class="text-muted small mt-1" id="saveStatus"></span>
        <button class="btn btn-sm btn-success rounded-pill px-3" onclick="sauvegarderNotes()"><i class="fas fa-save me-1"></i>Enregistrer les modifications</button>
      </div>
    </div>
    <div class="dash-card-body p-0" style="overflow-x:auto">
      <table class="dash-table table-bordered mb-0">
        <thead class="bg-light">
          <tr>
            <th style="width: 50px;" class="text-center">N°</th>
            <th style="width: 250px;">Élève</th>
            <th class="text-center col-note" title="Note de la séquence">Note (/20)</th>
            <th>Appréciation / Observation</th>
          </tr>
        </thead>
        <tbody id="grilleSaisieBody">
          <!-- Chargé en JS -->
        </tbody>
      </table>
    </div>
  </div>

</main>


<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/vendor/dexie.min.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/security.js"></script>

<script>
let currentEleves = [];
let currentNotes = [];
let currentClasseId = null;
let currentMatiereId = null;
let currentPeriodeId = null;
let role = 'admin';

async function initNotes() {
    if(!window.supabase) return;
    
    const sessionStr = localStorage.getItem('edu_session');
    const etabId = sessionStr ? JSON.parse(sessionStr).etablissement_id : null;
    
    // Charger l'année académique active
    let anneeQuery = window.supabase.from('annees_academiques').select('id').eq('statut', 'Active');
    if (etabId) anneeQuery = anneeQuery.eq('etablissement_id', etabId);
    
    const { data: anneeActive, error: anneeError } = await anneeQuery.maybeSingle();
    
    if (anneeError) console.error("Erreur année active:", anneeError);
    window.currentAcademicYearId = anneeActive ? anneeActive.id : null;
    
    if(!window.currentAcademicYearId) {
        console.warn("Aucune année académique active trouvée.");
    }
    
    // Déterminer le rôle
    const session = await window.supabase.auth.getSession();
    if (session.data.session) {
        const r = JSON.parse(localStorage.getItem('edu_session') || '{}').role || 'admin';
        role = r.toLowerCase();
    }
    
    // Charger les périodes (qui sont les mêmes pour tous)
    const {data: periodes} = await window.supabase.from('periodes_evaluation').select('*').eq('actif', true).order('ordre');
    const selPeriode = document.getElementById('selPeriode');
    selPeriode.innerHTML = '<option value="">Sélectionner...</option>' + 
        (periodes||[]).map(p => `<option value="${p.id}">${p.nom}</option>`).join('');
        
    // Charger toutes les classes (elles sont partagées entre les années)
    let queryClasses = window.supabase.from('classes')
        .select('id, nom, titulaire_id')
        .order('nom');
    const {data: allClasses} = await queryClasses;
    let classesAffichees = allClasses || [];
    
    // Si c'est un enseignant, on filtre localement
    if (role === 'enseignant') {
        const uid = session.data.session.user.id;
        const {data: ens} = await window.supabase.from('enseignants').select('id').eq('user_id', uid).single();
        if (ens) {
            window.currentEnseignantId = ens.id; // Stocker pour le filtrage des matières
            
            // Trouver ses matières
            const {data: matieres} = await window.supabase.from('matieres').select('id').eq('enseignant_id', ens.id);
            const matIds = (matieres||[]).map(m => m.id);
            
            let classeIdsOuIlEnseigne = new Set();
            if(matIds.length > 0) {
                const {data: cm} = await window.supabase.from('classes_matieres').select('classe_id').in('matiere_id', matIds);
                (cm||[]).forEach(c => classeIdsOuIlEnseigne.add(c.classe_id));
            }
            
            // Garder uniquement les classes où il enseigne OU dont il est prof principal
            classesAffichees = classesAffichees.filter(c => classeIdsOuIlEnseigne.has(c.id) || c.titulaire_id === ens.id);
        }
    }
    
    const selClasse = document.getElementById('selClasse');
    selClasse.innerHTML = '<option value="">Sélectionner une classe</option>' + 
        classesAffichees.map(c => `<option value="${c.id}">${c.nom}</option>`).join('');
}

window.onClasseChange = async function() {
    const cid = document.getElementById('selClasse').value;
    const selMatiere = document.getElementById('selMatiere');
    
    if(!cid) {
        selMatiere.innerHTML = '<option value="">Sélectionner une classe d\'abord</option>';
        selMatiere.disabled = true;
        return;
    }
    
    selMatiere.innerHTML = '<option value="">Chargement...</option>';
    selMatiere.disabled = true;
    
    // Charger les matières assignées à cette classe
    const {data: matieresAssignees} = await window.supabase
        .from('classes_matieres')
        .select('matiere_id, matieres(id, nom, enseignant_id)')
        .eq('classe_id', cid);
        
    let matieresAffichees = matieresAssignees || [];
    
    // Si c'est un enseignant, il ne voit que SES matières
    if (role === 'enseignant' && window.currentEnseignantId) {
        matieresAffichees = matieresAffichees.filter(m => m.matieres && m.matieres.enseignant_id === window.currentEnseignantId);
    }
          
    if(matieresAffichees.length === 0) {
        selMatiere.innerHTML = '<option value="">Aucune matière disponible pour vous</option>';
    } else {
        selMatiere.innerHTML = '<option value="">Sélectionner une matière</option>' + 
            matieresAffichees.map(m => `<option value="${m.matieres.id}">${m.matieres.nom}</option>`).join('');
        selMatiere.disabled = false;
    }
}

window.chargerGrille = async function() {
    currentClasseId = document.getElementById('selClasse').value;
    currentMatiereId = document.getElementById('selMatiere').value;
    currentPeriodeId = document.getElementById('selPeriode').value;
    
    if(!currentClasseId || !currentMatiereId || !currentPeriodeId) {
        alert("Veuillez sélectionner la classe, la matière et la période.");
        return;
    }
    
    // UI Update
    document.getElementById('gridContainer').classList.remove('d-none');
    const tbody = document.getElementById('grilleSaisieBody');
    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-primary spinner-border-sm"></div> Chargement de la grille...</td></tr>';
    
    const cNom = document.getElementById('selClasse').options[document.getElementById('selClasse').selectedIndex].text;
    const mNom = document.getElementById('selMatiere').options[document.getElementById('selMatiere').selectedIndex].text;
    const pNom = document.getElementById('selPeriode').options[document.getElementById('selPeriode').selectedIndex].text;
    document.getElementById('gridTitle').innerHTML = `<i class="fas fa-table text-primary me-2"></i>Saisie : ${cNom} - ${mNom} (${pNom})`;
    
    // 1. Charger les élèves de la classe via leurs inscriptions pour l'année courante
    const debugDiv = document.createElement('div');
    debugDiv.className = 'alert alert-info mt-3';
    debugDiv.innerHTML = `<strong>DEBUG:</strong> classe_id=${currentClasseId}, annee_id=${window.currentAcademicYearId}`;
    document.getElementById('gridContainer').prepend(debugDiv);

    const {data: inscr, error: inscrError} = await window.supabase.from('inscriptions_annuelles')
        .select('eleve_id, statut, eleves(id, prenom, nom, matricule)')
        .eq('classe_id', currentClasseId)
        .eq('annee_academique_id', window.currentAcademicYearId);
    
    if (inscrError) {
        debugDiv.innerHTML += `<br><span class='text-danger'>Error: ${inscrError.message}</span>`;
    } else {
        debugDiv.innerHTML += `<br><strong>DEBUG:</strong> Found ${inscr ? inscr.length : 0} rows in inscriptions_annuelles.`;
        if (inscr && inscr.length > 0) {
            debugDiv.innerHTML += `<br><strong>DEBUG:</strong> First row: ${JSON.stringify(inscr[0])}`;
        }
    }
    
    currentEleves = inscr ? inscr.map(i => i.eleves).filter(e => e) : [];
    currentEleves.sort((a,b) => (a.nom||'').localeCompare(b.nom||''));
    
    if(currentEleves.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Aucun élève dans cette classe pour cette année académique.</td></tr>';
        return;
    }
    
    // 2. Charger les notes existantes pour cette matière, classe, période ET année académique
    const {data: notes} = await window.supabase
        .from('notes')
        .select('*')
        .eq('matiere_id', currentMatiereId)
        .eq('periode_id', currentPeriodeId)
        .eq('annee_academique_id', window.currentAcademicYearId);
        
    currentNotes = notes || [];
    
    // 3. Générer le HTML
    const _e = (str) => str ? str.replace(/"/g, '&quot;') : '';
    tbody.innerHTML = currentEleves.map((e, index) => {
        const eleveNote = currentNotes.find(n => n.eleve_id === e.id);
        
        const valNote = eleveNote ? eleveNote.valeur : '';
        const appre = eleveNote ? eleveNote.commentaire : '';
        
        return `
        <tr data-eleve="${e.id}">
            <td class="text-center text-muted">${index + 1}</td>
            <td class="fw-medium">${_e(e.nom)} ${_e(e.prenom)}</td>
            <td>
                <input type="number" class="form-control form-control-sm text-center n-seq mx-auto" style="width:80px" min="0" max="20" step="0.25" value="${valNote}" oninput="markDirty(this)">
            </td>
            <td>
                <input type="text" class="form-control form-control-sm n-appre" value="${_e(appre)}" oninput="markDirty(this)">
            </td>
        </tr>
        `;
    }).join('');
}

window.markDirty = function(input) {
    input.classList.add('dirty');
    document.getElementById('saveStatus').innerHTML = '<span class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i>Modifications non enregistrées</span>';
    
    // Auto-appreciation logic
    if (input.classList.contains('n-seq')) {
        const val = input.value;
        const tr = input.closest('tr');
        const inputAppre = tr.querySelector('.n-appre');
        
        if (val !== '' && inputAppre) {
            const m = parseFloat(val);
            let appreciation = "Excellent";
            if (m < 5) appreciation = "Mauvais";
            else if (m < 8) appreciation = "Faible";
            else if (m < 10) appreciation = "Insuffisant";
            else if (m < 12) appreciation = "Passable";
            else if (m < 14) appreciation = "Assez Bien";
            else if (m < 16) appreciation = "Bien";
            else if (m < 18) appreciation = "Très Bien";
            
            inputAppre.value = appreciation;
            inputAppre.classList.add('dirty');
        } else if (val === '' && inputAppre) {
            inputAppre.value = '';
            inputAppre.classList.add('dirty');
        }
    }
}

window.sauvegarderNotes = async function() {
    const rows = document.querySelectorAll('#grilleSaisieBody tr');
    let notesToUpsert = [];
    
    const selMatiere = document.getElementById('selMatiere');
    const matiereNom = selMatiere.options[selMatiere.selectedIndex].text;
    
    rows.forEach(tr => {
        const eleveId = tr.getAttribute('data-eleve');
        const noteInput = tr.querySelector('.n-seq');
        const appreInput = tr.querySelector('.n-appre');
        
        const ancienneNote = currentNotes.find(n => n.eleve_id === eleveId);
        
        if (noteInput.classList.contains('dirty') || appreInput.classList.contains('dirty') || (noteInput.value !== '' && !ancienneNote)) {
            if (noteInput.value !== '') {
                const noteObj = {
                    eleve_id: eleveId,
                    matiere_id: currentMatiereId,
                    matiere: matiereNom,
                    periode_id: currentPeriodeId,
                    type_evaluation: 'Séquence',
                    valeur: parseFloat(noteInput.value),
                    commentaire: appreInput.value,
                    statut: 'Brouillon',
                    annee_academique_id: window.currentAcademicYearId
                };
                if (ancienneNote && ancienneNote.id) {
                    noteObj.id = ancienneNote.id;
                }
                notesToUpsert.push(noteObj);
            }
        }
    });
    
    if(notesToUpsert.length === 0) {
        document.getElementById('saveStatus').innerHTML = '<span class="text-muted">Aucune modification à sauvegarder.</span>';
        return;
    }
    
    document.getElementById('saveStatus').innerHTML = '<span class="text-primary"><i class="fas fa-spinner fa-spin me-1"></i>Enregistrement...</span>';
    
    // Utiliser upsert
    const { error } = await window.supabase.from('notes').upsert(notesToUpsert);
    
    if (error) {
        console.error(error);
        alert("Erreur lors de la sauvegarde: " + error.message);
        document.getElementById('saveStatus').innerHTML = '<span class="text-danger"><i class="fas fa-times me-1"></i>Erreur</span>';
    } else {
        document.getElementById('saveStatus').innerHTML = '<span class="text-success"><i class="fas fa-check me-1"></i>Enregistré avec succès !</span>';
        // Remove dirty classes
        document.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
        // Rafraichir l'état interne
        const {data: notes} = await window.supabase.from('notes').select('*').eq('matiere_id', currentMatiereId).eq('periode_id', currentPeriodeId);
        currentNotes = notes || [];
    }
}

window.openBulletinsInterface = function() {
    window.location.href = "bulletins.html";
}

document.addEventListener('DOMContentLoaded', () => {
    setTimeout(initNotes, 500);
});
</script>
</body>
</html>
