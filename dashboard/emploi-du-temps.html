<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Emplois du temps – EduManager</title>
  <link rel="icon" type="image/png" href="..//img/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="/css/vendor/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/vendor/all.min.css" rel="stylesheet"/>
  <link href="../css/dashboard.css" rel="stylesheet"/>
  <style>
    .timetable { border-collapse:collapse; width:100%; }
    .timetable th, .timetable td { border:1px solid var(--border); padding:.5rem .6rem; font-size:.8rem; min-width:110px; }
    .timetable thead th { background:#FAFBFC; font-weight:700; color:var(--muted); text-align:center; text-transform:uppercase; font-size:.7rem; }
    .timetable td.time-col { background:#FAFBFC; font-weight:600; color:var(--muted); font-size:.75rem; text-align:center; white-space:nowrap; width:80px; }
    .tt-slot { border-radius:6px; padding:6px 8px; font-size:.78rem; font-weight:500; cursor:pointer; transition:opacity .2s; }
    .tt-slot:hover { opacity:.8; }
    .tt-math { background:rgba(37,99,235,.12); color:#1D4ED8; }
    .tt-french { background:rgba(16,185,129,.12); color:#059669; }
    .tt-hist { background:rgba(245,158,11,.12); color:#D97706; }
    .tt-svt { background:rgba(139,92,246,.12); color:#7C3AED; }
    .tt-phys { background:rgba(239,68,68,.12); color:#DC2626; }
    .tt-eng  { background:rgba(6,182,212,.12); color:#0891B2; }
    .tt-eps  { background:rgba(16,185,129,.15); color:#059669; }
    .tt-break { background:#F8FAFC; color:var(--muted); text-align:center; font-style:italic; }
  </style>
  <link rel="manifest" href="../manifest.json" />
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<header class="topbar" id="topbar">
  <button class="topbar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div class="topbar-search"><i class="fas fa-search"></i><input type="text" placeholder="Rechercher…"/></div>
  <div class="topbar-actions"><button class="topbar-btn"><i class="fas fa-bell"></i><span class="notif-dot"></span></button><div class="topbar-divider"></div><div class="user-av" style="cursor:pointer">D</div></div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <h1 class="page-title">Emplois du temps</h1>
      <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="/dashboard/">Accueil</a></li><li class="breadcrumb-item active">Emplois du temps</li></ol></nav>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="btnImprimerEmploi"><i class="fas fa-print me-1"></i>Imprimer</button>
      <button class="btn btn-primary btn-sm rounded-pill px-3" id="btnAjouterCreneau"><i class="fas fa-plus me-1"></i>Ajouter un créneau</button>
    </div>
  </div>

  <!-- Sélecteur -->
  <div class="dash-card mb-4 p-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-3"><label class="form-label">Classe</label><select class="form-select" id="emploi_classe"><option value="">Sélectionner une classe</option></select></div>
      <div class="col-md-3"><label class="form-label">Semaine</label><input type="week" class="form-control" id="emploi_semaine" value="2026-W03"/></div>
      <div class="col-md-3"><label class="form-label">Vue</label><select class="form-select" id="emploi_vue"><option>Semaine</option><option>Jour</option><option>Mois</option></select></div>
      <div class="col-md-3"><button class="btn btn-primary w-100 rounded-pill" id="btnAfficherEmploi">Afficher</button></div>
    </div>
  </div>

  <!-- Légende -->
  <div class="d-flex flex-wrap gap-2 mb-3">
    <span class="tt-slot tt-math px-3">Mathématiques</span>
    <span class="tt-slot tt-french px-3">Français</span>
    <span class="tt-slot tt-hist px-3">Histoire-Géo</span>
    <span class="tt-slot tt-svt px-3">SVT</span>
    <span class="tt-slot tt-phys px-3">Physique-Chimie</span>
    <span class="tt-slot tt-eng px-3">Anglais</span>
    <span class="tt-slot tt-eps px-3">EPS</span>
  </div>

  <!-- Grille emploi du temps -->
  <div class="dash-card">
    <div class="dash-card-header">
      <span class="dash-card-title"><i class="fas fa-calendar-week text-primary me-2"></i>Emploi du temps – 3ème B · Semaine du 12 Jan 2026</span>
    </div>
    <div class="dash-card-body p-0" style="overflow-x:auto">
      <table class="timetable">
        <thead>
          <tr>
            <th>Heure</th>
            <th>Lundi</th><th>Mardi</th><th>Mercredi</th><th>Jeudi</th><th>Vendredi</th>
          </tr>
        </thead>
        <tbody id="dynamicBody">
          <!-- Données dynamiques insérées ici -->
        </tbody>
      </table>
    </div>
  </div>
  <!-- Modal Ajouter un créneau -->
  <div class="modal fade" id="addCreneauModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius:1rem; overflow:hidden">
        <div class="modal-header border-0 bg-light pb-2">
          <h5 class="modal-title fw-bold"><i class="fas fa-plus-circle text-primary me-2"></i>Nouveau créneau</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-2">
          <form id="formAddCreneau">
            <div class="row g-3">
              <div class="col-md-12"><label class="form-label">Classe *</label><select class="form-select" name="classe_id" id="creneauClasseSelect"><option value="">Sélectionner...</option></select></div>
              <div class="col-md-6"><label class="form-label">Jour *</label><select class="form-select" name="jour_semaine"><option value="Lundi">Lundi</option><option value="Mardi">Mardi</option><option value="Mercredi">Mercredi</option><option value="Jeudi">Jeudi</option><option value="Vendredi">Vendredi</option><option value="Samedi">Samedi</option></select></div>
              <div class="col-md-6"><label class="form-label">Heure de début *</label><input type="time" name="heure_debut" class="form-control" value="08:00"></div>
              <div class="col-md-6"><label class="form-label">Heure de fin *</label><input type="time" name="heure_fin" class="form-control" value="10:00"></div>
              <div class="col-md-6"><label class="form-label">Matière *</label>
                <input type="text" class="form-control" name="matiere" list="edtMatieresList" placeholder="Ex: Mathématiques">
                <datalist id="edtMatieresList"></datalist>
              </div>
              <div class="col-md-6"><label class="form-label">Enseignant</label><select class="form-select" name="enseignant_id" id="creneauProfSelect"><option value="">Sélectionner...</option></select></div>
              <div class="col-md-6"><label class="form-label">Salle</label><input type="text" class="form-control" name="salle" placeholder="Ex: Salle 3"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0 bg-light pt-2">
          <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-primary rounded-pill px-4" id="btnSaveCreneau">Ajouter</button>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="../js/dashboard.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js');
  }
</script>

<script src="../js/vendor/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
  <script src="../js/security.js"></script>
  <script src="../js/sidebar.js"></script>
</body>
</html>
