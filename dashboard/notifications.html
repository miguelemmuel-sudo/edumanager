<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Notifications – EduManager</title>
  <link rel="icon" type="image/png" href="..//img/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="/css/vendor/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/vendor/all.min.css" rel="stylesheet"/>
  <link href="../css/dashboard.css" rel="stylesheet"/>
  <link rel="manifest" href="../manifest.json" />
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<header class="topbar" id="topbar">
  <button class="topbar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div class="topbar-search"><i class="fas fa-search"></i><input type="text" placeholder="Rechercher…"/></div>
  <div class="topbar-actions"><button class="topbar-btn"><i class="fas fa-bell"></i><span class="notif-dot"></span></button><div class="topbar-divider"></div><div class="user-av" style="cursor:pointer">D</div></div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <h1 class="page-title">Notifications</h1>
      <p class="page-subtitle mb-0">Gérez et envoyez des notifications aux parents et enseignants.</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="markAllRead()"><i class="fas fa-check-double me-1"></i>Tout marquer lu</button>
      <button class="btn btn-primary btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#sendNotifModal"><i class="fas fa-paper-plane me-1"></i>Envoyer une notification</button>
    </div>
  </div>

  <div class="row g-4">
    <!-- Flux notifications reçues -->
    <div class="col-lg-7">
      <div class="dash-card">
        <div class="dash-card-header">
          <span class="dash-card-title"><i class="fas fa-bell text-primary me-2"></i>Notifications reçues</span>
          <div class="d-flex gap-2 ms-auto">
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 active-filter" id="f-all" onclick="filterNotif('all',this)">Toutes</button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" id="f-unread" onclick="filterNotif('unread',this)">Non lues</button>
          </div>
        </div>
        <div class="dash-card-body p-0" id="notifList">
          <!-- Données dynamiques insérées ici -->
        </div>
      </div>
    </div>

    <!-- Panel envoi + historique -->
    <div class="col-lg-5">
      <!-- Stats envois -->
      <div class="dash-card mb-3">
        <div class="dash-card-header"><span class="dash-card-title"><i class="fas fa-chart-bar text-primary me-2"></i>Ce mois</span></div>
        <div class="dash-card-body">
          <div class="row text-center mt-3 g-2">
            <div class="col-4"><div class="sc-value text-primary" id="notifReçuesVal">0</div><div class="sc-label">Reçues</div></div>
            <div class="col-4"><div class="sc-value text-success" id="notifLuesVal">0</div><div class="sc-label">Lues</div></div>
            <div class="col-4"><div class="sc-value text-muted" id="notifTauxVal">0%</div><div class="sc-label">Taux lecture</div></div>
          </div>
          <div class="prog-bar mt-3"><div class="prog-fill" id="notifTauxBar" style="width:0%;background:var(--success)"></div></div>
        </div>
      </div>
      <!-- Historique envois -->
      <div class="dash-card">
        <div class="dash-card-header"><span class="dash-card-title"><i class="fas fa-history text-success me-2"></i>Derniers envois</span></div>
        <div class="dash-card-body p-0" id="derniersEnvoisList">
          <!-- Données dynamiques insérées ici -->
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Modal envoyer notification -->
<div class="modal fade" id="sendNotifModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title fw-bold"><i class="fas fa-paper-plane text-primary me-2"></i>Envoyer une notification</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <form id="formSendNotif">
        <div class="mb-3">
          <label class="form-label">Destinataires *</label>
          <select name="destinataire_grp" class="form-select">
            <option value="Tous les parents">Tous les parents</option>
            <option value="Tous les enseignants">Tous les enseignants</option>
            <option value="Parents – 3ème B">Parents – 3ème B</option>
            <option value="Parents – 6ème A">Parents – 6ème A</option>
            <option value="Parents avec impayés">Parents avec impayés</option>
            <option value="Personnalisé…">Personnalisé…</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Canal d'envoi</label>
          <div class="d-flex gap-3">
            <div class="form-check"><input class="form-check-input" type="checkbox" name="canal_sms" id="cSms" checked/><label class="form-check-label small" for="cSms"><i class="fas fa-sms text-success me-1"></i>SMS</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="canal_email" id="cEmail" checked/><label class="form-check-label small" for="cEmail"><i class="fas fa-envelope text-primary me-1"></i>Email</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="canal_app" id="cApp"/><label class="form-check-label small" for="cApp"><i class="fas fa-mobile-alt text-warning me-1"></i>Application</label></div>
          </div>
        </div>
        <div class="mb-3"><label class="form-label">Titre *</label><input type="text" name="titre" class="form-control" placeholder="Ex: Réunion parents d'élèves"/></div>
        <div class="mb-3"><label class="form-label">Message *</label><textarea name="message" class="form-control" rows="4" placeholder="Rédigez votre notification…"></textarea></div>
      </form>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Annuler</button><button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold" id="btnSaveNotif"><i class="fas fa-paper-plane me-2"></i>Envoyer</button></div>
  </div></div>
</div>

<style>
.notif-unread { background:rgba(37,99,235,.025); }
.active-filter { background:var(--primary) !important; color:white !important; border-color:var(--primary) !important; }
</style>
<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="../js/dashboard.js"></script>


<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js');
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
  <script src="../js/security.js"></script>
  <script src="../js/sidebar.js"></script>
</body>
</html>
