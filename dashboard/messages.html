<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Messages – EduManager</title>
  <link rel="icon" type="image/png" href="..//img/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="/css/vendor/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/vendor/all.min.css" rel="stylesheet"/>
  <link href="../css/dashboard.css" rel="stylesheet"/>
  <style>
    .msg-layout { display:flex; gap:0; height:calc(100vh - 140px); overflow:hidden; background:white; border:1px solid var(--border); border-radius:.875rem; }
    .msg-sidebar { width:300px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    .msg-sidebar-header { padding:1rem; border-bottom:1px solid var(--border); }
    .msg-list { flex:1; overflow-y:auto; }
    .msg-item { padding:.85rem 1rem; cursor:pointer; border-bottom:1px solid #F8FAFC; transition:background .15s; display:flex; align-items:flex-start; gap:.75rem; }
    .msg-item:hover { background:#F8FAFC; }
    .msg-item.active { background:rgba(37,99,235,.06); border-left:3px solid var(--primary); }
    .msg-item.unread .msg-item-subject { font-weight:700; color:var(--text); }
    .msg-item-av { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; color:white; flex-shrink:0; }
    .msg-item-subject { font-size:.83rem; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .msg-item-preview { font-size:.75rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .msg-item-time { font-size:.7rem; color:var(--muted); white-space:nowrap; flex-shrink:0; }
    .msg-unread-dot { width:8px; height:8px; border-radius:50%; background:var(--primary); flex-shrink:0; margin-top:5px; }
    /* Chat panel */
    .msg-chat { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .msg-chat-header { padding:1rem 1.25rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:.75rem; }
    .msg-chat-body { flex:1; overflow-y:auto; padding:1.25rem; display:flex; flex-direction:column; gap:1rem; background:#F8FAFC; }
    .bubble { max-width:70%; padding:.75rem 1rem; border-radius:1rem; font-size:.875rem; line-height:1.5; }
    .bubble.received { background:white; border:1px solid var(--border); border-bottom-left-radius:.25rem; align-self:flex-start; }
    .bubble.sent { background:var(--primary); color:white; border-bottom-right-radius:.25rem; align-self:flex-end; }
    .bubble-meta { font-size:.7rem; color:var(--muted); margin-top:3px; }
    .bubble-meta.sent-meta { text-align:right; }
    .msg-chat-footer { padding:1rem; border-top:1px solid var(--border); background:white; }
    .msg-input-wrap { display:flex; align-items:flex-end; gap:.75rem; background:#F8FAFC; border:1.5px solid var(--border); border-radius:.875rem; padding:.5rem .75rem; transition:border-color .2s; }
    .msg-input-wrap:focus-within { border-color:var(--primary); }
    .msg-input { flex:1; border:none; background:none; resize:none; outline:none; font-size:.875rem; color:var(--text); max-height:120px; min-height:36px; }
    .msg-send-btn { width:36px; height:36px; border-radius:50%; background:var(--primary); border:none; color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:background .2s; }
    .msg-send-btn:hover { background:var(--primary-dark); }
    .msg-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; color:var(--muted); }
  </style>
  <link rel="manifest" href="../manifest.json" />
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<header class="topbar" id="topbar">
  <button class="topbar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div class="topbar-search"><i class="fas fa-search"></i><input type="text" placeholder="Rechercher un message…"/></div>
  <div class="topbar-actions">
    <div id="syncStatusIndicator" class="me-3 d-flex align-items-center"></div><button class="topbar-btn"><i class="fas fa-bell"></i><span class="notif-dot"></span></button><div class="topbar-divider"></div><div class="user-av" style="cursor:pointer">D</div></div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header d-flex align-items-center justify-content-between mb-3">
    <div><h1 class="page-title">Messages</h1></div>
    <button class="btn btn-primary btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#newMsgModal"><i class="fas fa-pen me-1"></i>Nouveau message</button>
  </div>

  <div class="msg-layout">
    <!-- Liste conversations -->
    <div class="msg-sidebar">
      <div class="msg-sidebar-header">
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-light border-end-0"><i class="fas fa-search text-muted" style="font-size:.8rem"></i></span>
          <input type="text" class="form-control bg-light border-start-0" placeholder="Rechercher…" style="font-size:.82rem"/>
        </div>
      </div>
      <div class="msg-list" id="msgList">
        <!-- Données dynamiques insérées ici -->
      </div>
    </div>

    <!-- Zone de chat -->
    <div class="msg-chat">
      <!-- Header chat -->
      <div class="msg-chat-header" id="chatHeader" style="display:none;">
        <div class="msg-item-av" id="chatHeaderAv" style="background:#2563EB;width:38px;height:38px">D</div>
        <div>
          <div class="fw-semibold" id="chatName">Sélectionnez une conversation</div>
          <div class="text-muted" style="font-size:.75rem" id="chatDesc"></div>
        </div>
        <div class="ms-auto d-flex gap-2">
          <button class="topbar-btn" title="Appeler"><i class="fas fa-phone"></i></button>
          <button class="topbar-btn" title="Infos"><i class="fas fa-info-circle"></i></button>
        </div>
      </div>
      <!-- Messages -->
      <div class="msg-chat-body" id="chatBody">
        <div class="msg-empty">Aucun message</div>
      </div>
      <!-- Input -->
      <div class="msg-chat-footer">
        <div class="msg-input-wrap">
          <button class="topbar-btn" title="Joindre un fichier" style="width:30px;height:30px;flex-shrink:0"><i class="fas fa-paperclip" style="font-size:.85rem"></i></button>
          <textarea class="msg-input" placeholder="Écrire un message…" rows="1" id="msgInput" onkeydown="handleEnter(event)"></textarea>
          <button class="msg-send-btn" onclick="sendMessage()" title="Envoyer">
            <i class="fas fa-paper-plane" style="font-size:.8rem"></i>
          </button>
        </div>
        <div class="d-flex gap-3 mt-2" style="font-size:.75rem;color:var(--muted)">
          <span style="cursor:pointer;transition:color .2s" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--muted)'" onclick="insertEmoji()"><i class="fas fa-smile me-1"></i>Émojis</span>
          <span style="cursor:pointer;transition:color .2s" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--muted)'" onclick="document.getElementById('chatFileInput').click()"><i class="fas fa-file me-1"></i>Fichier</span>
          <span style="cursor:pointer;transition:color .2s" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--muted)'" onclick="document.getElementById('chatFileInput').click()"><i class="fas fa-image me-1"></i>Image</span>
          <input type="file" id="chatFileInput" style="display:none" onchange="handleFileUpload(event)">
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Modal nouveau message -->
<div class="modal fade" id="newMsgModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title fw-bold"><i class="fas fa-pen text-primary me-2"></i>Nouveau message</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <form id="formAddMessage">
        <div class="mb-3">
          <label class="form-label">Destinataire(s) / Groupe *</label>
          <select name="destinataire_grp" class="form-select">
            <option value="">Sélectionner un groupe…</option>
            <option value="Tous les parents">Tous les parents</option>
            <option value="Parents – 3ème B">Parents – 3ème B</option>
            <option value="Parents – 6ème A">Parents – 6ème A</option>
            <option value="Tous les enseignants">Tous les enseignants</option>
          </select>
        </div>
        <div class="mb-3"><label class="form-label">Objet</label><input type="text" name="sujet" class="form-control" placeholder="Objet du message"/></div>
        <div class="mb-3"><label class="form-label">Message *</label><textarea name="contenu" class="form-control" rows="5" placeholder="Rédigez votre message…"></textarea></div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Annuler</button>
      <button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold" onclick="sendNewMessage()"><i class="fas fa-paper-plane me-2"></i>Envoyer</button>
    </div>
  </div></div>
</div>

<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="../js/dashboard.js"></script>
<script>


<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js');
  }
</script>

<script src="../js/vendor/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/vendor/dexie.min.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
  <script src="../js/security.js"></script>
  <script src="../js/sidebar.js"></script>
</body>
</html>
