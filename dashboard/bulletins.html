<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Génération des Bulletins – EduManager</title>
  <link rel="icon" type="image/png" href="..//img/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="/css/vendor/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/vendor/all.min.css" rel="stylesheet"/>
  <link href="../css/dashboard.css" rel="stylesheet"/>
  <style>
    /* Styling Premium pour le bulletin */
    .bulletin-preview {
        background: #fff;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        border-radius: 8px;
        margin: 20px auto;
        max-width: 900px;
        color: #333;
        font-family: 'Inter', sans-serif;
    }
    .bulletin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid var(--primary);
        padding-bottom: 20px;
        margin-bottom: 30px;
    }
    .bulletin-etab-info h2 {
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 5px;
        text-transform: uppercase;
        font-size: 1.5rem;
    }
    .bulletin-etab-info p { margin: 0; font-size: 0.85rem; color: #555; }
    .bulletin-student-info {
        display: flex;
        gap: 40px;
        margin-bottom: 30px;
        background: #f8fafc;
        padding: 20px;
        border-radius: 8px;
        border-left: 4px solid var(--primary);
    }
    .info-group span { display: block; }
    .info-group .label { font-size: 0.75rem; text-transform: uppercase; color: #777; font-weight: 600; }
    .info-group .val { font-size: 1.1rem; font-weight: 700; color: #111; }
    
    .bulletin-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
    .bulletin-table th, .bulletin-table td {
        border: 1px solid #e2e8f0;
        padding: 10px 12px;
        text-align: center;
        font-size: 0.9rem;
    }
    .bulletin-table th { background: var(--primary); color: #fff; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; }
    .bulletin-table .text-start { text-align: left; }
    .bulletin-table .matiere-row { font-weight: 600; background: #f8fafc; }
    
    .bulletin-footer {
        display: flex;
        justify-content: space-between;
        margin-top: 40px;
    }
    .signature-box {
        text-align: center;
        width: 200px;
    }
    .signature-box .title { font-weight: 600; font-size: 0.9rem; margin-bottom: 60px; }
    .signature-box .line { border-top: 1px dashed #999; }
    
    .bulletin-summary {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        padding: 20px;
        display: flex;
        justify-content: space-around;
        text-align: center;
        margin-bottom: 30px;
    }
    .summary-item .val { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .summary-item .label { font-size: 0.8rem; color: #555; text-transform: uppercase; font-weight: 600; }
  </style>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<header class="topbar" id="topbar">
  <button class="topbar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div class="topbar-search"><i class="fas fa-search"></i><input type="text" placeholder="Rechercher…"/></div>
  <div class="topbar-actions">
    <div id="syncStatusIndicator" class="me-3 d-flex align-items-center"></div><button class="topbar-btn"><i class="fas fa-bell"></i><span class="notif-dot"></span></button><div class="topbar-divider"></div><div class="user-av" style="cursor:pointer">D</div></div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <h1 class="page-title">Génération des Bulletins</h1>
      <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="">Accueil</a></li><li class="breadcrumb-item"><a href="notes.html">Notes</a></li><li class="breadcrumb-item active">Bulletins</li></ol></nav>
    </div>
  </div>

  <div class="dash-card mb-4 p-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Classe</label>
        <select class="form-select" id="selClasse" onchange="loadEleves()">
          <option value="">Sélectionner une classe</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Période d'évaluation</label>
        <select class="form-select" id="selPeriode" onchange="loadEleves()">
          <option value="">Chargement...</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Élève</label>
        <select class="form-select" id="selEleve" disabled>
          <option value="">Sélectionner une classe d'abord</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button class="btn btn-primary flex-grow-1 rounded-pill" onclick="genererBulletin()">Générer / Calculer</button>
      </div>
    </div>
  </div>

  <!-- Aperçu du Bulletin -->
  <div id="bulletinPreviewContainer" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold m-0 text-primary"><i class="fas fa-eye me-2"></i>Aperçu du bulletin professionnel</h5>
        <div class="d-flex gap-2">
            <button class="btn btn-warning rounded-pill px-4 text-dark fw-bold" id="btnValider" onclick="validerBulletin()"><i class="fas fa-check-circle me-1"></i>Valider le bulletin</button>
            <button class="btn btn-success rounded-pill px-4 fw-bold d-none" id="btnPublier" onclick="publierBulletin()"><i class="fas fa-paper-plane me-1"></i>Publier</button>
            <button class="btn btn-outline-primary rounded-pill px-4" onclick="exporterPDF()"><i class="fas fa-file-pdf me-1"></i>Exporter PDF</button>
        </div>
    </div>
    
    <div class="bulletin-preview" id="printableBulletin">
        <!-- Rempli par le JS -->
    </div>
  </div>

</main>


<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/vendor/dexie.min.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/security.js"></script>

<script>
let currentEtab = null;
let currentEleveData = null;
let generatedData = null;
let periodesDict = {};

async function initBulletins() {
    if(!window.supabase) return;
    
    // Charger infos Etablissement
    const {data: etab} = await window.supabase.from('etablissements').select('*').limit(1).single();
    currentEtab = etab || { nom: "Mon Établissement", adresse: "", tel: "", email: "" };
    
    // Charger Périodes
    const {data: periodes} = await window.supabase.from('periodes_evaluation').select('*').eq('actif', true).order('ordre');
    
    // Build dict
    periodesDict = {};
    if(periodes) {
        periodes.forEach(p => periodesDict[p.id] = p);
    }
    
    document.getElementById('selPeriode').innerHTML = '<option value="">Sélectionner...</option>' + 
        (periodes||[]).map(p => `<option value="${p.id}">${p.nom}</option>`).join('');
        
    // Charger Classes
    const {data: classes} = await window.supabase.from('classes').select('id, nom').order('nom');
    document.getElementById('selClasse').innerHTML = '<option value="">Sélectionner une classe</option>' + 
        (classes||[]).map(c => `<option value="${c.id}">${c.nom}</option>`).join('');
}

async function loadEleves() {
    const cid = document.getElementById('selClasse').value;
    const selEleve = document.getElementById('selEleve');
    
    if(!cid) {
        selEleve.innerHTML = '<option value="">Sélectionner une classe d\'abord</option>';
        selEleve.disabled = true;
        return;
    }
    
    selEleve.innerHTML = '<option value="">Chargement...</option>';
    selEleve.disabled = true;
    
    const {data: eleves} = await window.supabase.from('eleves').select('*').eq('classe_id', cid).order('nom');
    if(!eleves || eleves.length === 0) {
        selEleve.innerHTML = '<option value="">Aucun élève</option>';
    } else {
        selEleve.innerHTML = '<option value="">Sélectionner un élève</option>' + 
            eleves.map(e => `<option value="${e.id}">${e.nom} ${e.prenom}</option>`).join('');
        selEleve.disabled = false;
    }
}

async function genererBulletin() {
    const cid = document.getElementById('selClasse').value;
    const pid = document.getElementById('selPeriode').value;
    const eid = document.getElementById('selEleve').value;
    
    if(!cid || !pid || !eid) {
        alert("Sélectionnez la classe, la période et l'élève.");
        return;
    }
    
    // Charger infos élève, classe, période
    const {data: eleve} = await window.supabase.from('eleves').select('*, classes(nom)').eq('id', eid).single();
    currentEleveData = eleve;
    
    const selectedPeriode = periodesDict[pid];
    if(!selectedPeriode) { alert("Période invalide."); return; }
    
    const pNom = document.getElementById('selPeriode').options[document.getElementById('selPeriode').selectedIndex].text;
    
    // Déterminer les sous-périodes si c'est un Trimestre (parent_id null)
    let isTrimestre = !selectedPeriode.parent_id;
    let periodesRecherche = [pid];
    let seqTitles = ["Note"];
    
    if (isTrimestre) {
        // Trouver les sous-périodes
        const enfants = Object.values(periodesDict).filter(p => p.parent_id === pid).sort((a,b) => a.ordre - b.ordre);
        if (enfants.length > 0) {
            periodesRecherche = enfants.map(e => e.id);
            seqTitles = enfants.map(e => e.nom);
        } else {
            isTrimestre = false; // Pas d'enfants, on traite comme une séquence unique
        }
    }
    
    // Charger les notes
    const {data: notes} = await window.supabase
        .from('notes')
        .select('*, matieres(nom, coefficient_defaut)')
        .eq('eleve_id', eid)
        .in('periode_id', periodesRecherche);
        
    if(!notes || notes.length === 0) {
        alert("Aucune note trouvée pour cet élève sur cette période.");
        return;
    }
    
    // Engine de calcul
    let totalPoints = 0;
    let totalCoefs = 0;
    let matieresStats = {};
    
    notes.forEach(n => {
        const mId = n.matiere_id;
        if(!matieresStats[mId]) {
            matieresStats[mId] = {
                nom: n.matieres.nom,
                coef: n.matieres.coefficient_defaut || 1,
                notesPeriodes: {},
                appreciation: ''
            };
        }
        matieresStats[mId].notesPeriodes[n.periode_id] = parseFloat(n.valeur);
        if(n.commentaire && n.commentaire.length > matieresStats[mId].appreciation.length) {
            matieresStats[mId].appreciation = n.commentaire; // Prend l'appréciation la plus longue
        }
    });
    
    let rowsHtml = '';
    
    for (let mId in matieresStats) {
        const m = matieresStats[mId];
        let sumNotes = 0;
        let countNotes = 0;
        let seqHtml = '';
        
        if (isTrimestre) {
            periodesRecherche.forEach(pId => {
                const n = m.notesPeriodes[pId];
                if (n !== undefined) {
                    sumNotes += n;
                    countNotes++;
                    seqHtml += `<td>${n.toFixed(2)}</td>`;
                } else {
                    seqHtml += `<td>-</td>`;
                }
            });
        } else {
            const n = m.notesPeriodes[pid];
            if (n !== undefined) {
                sumNotes = n;
                countNotes = 1;
                seqHtml += `<td>${n.toFixed(2)}</td>`;
            } else {
                seqHtml += `<td>-</td>`;
            }
        }
        
        let moy = countNotes > 0 ? (sumNotes / countNotes) : null;
        
        if (moy !== null) {
            totalPoints += (moy * m.coef);
            totalCoefs += m.coef;
            
            rowsHtml += `
                <tr>
                    <td class="text-start fw-bold">${m.nom}</td>
                    <td>${m.coef}</td>
                    ${seqHtml}
                    <td class="fw-bold ${moy >= 10 ? 'text-success' : 'text-danger'}" style="background-color:rgba(0,0,0,.03);">${moy.toFixed(2)}</td>
                    <td class="fw-bold">${(moy * m.coef).toFixed(2)}</td>
                    <td class="text-muted small text-start">${m.appreciation || ''}</td>
                </tr>
            `;
        }
    }
    
    const moyenneGenerale = totalCoefs > 0 ? (totalPoints / totalCoefs) : 0;
    let mention = 'Passable';
    if(moyenneGenerale >= 16) mention = 'Très Bien';
    else if(moyenneGenerale >= 14) mention = 'Bien';
    else if(moyenneGenerale >= 12) mention = 'Assez Bien';
    else if(moyenneGenerale < 10) mention = 'Insuffisant';
    
    let decision = moyenneGenerale >= 10 ? 'Admis' : 'Échec';
    
    // Garder en mémoire pour la sauvegarde
    generatedData = {
        eleve_id: eid,
        periode_id: pid,
        classe_id: cid,
        moyenne_generale: moyenneGenerale.toFixed(2),
        total_points: totalPoints.toFixed(2),
        total_coefs: totalCoefs.toFixed(2),
        mention: mention,
        decision: decision,
        donnees_json: matieresStats,
        statut: 'Brouillon'
    };
    
    // Génération des en-têtes de colonnes dynamiques
    let headerSeqHtml = '';
    seqTitles.forEach(t => headerSeqHtml += `<th>${t} (/20)</th>`);
    
    // Signatures
    const sigDir = currentEtab.signature_directeur_url ? `<img src="${currentEtab.signature_directeur_url}" style="max-height:80px; margin-top:10px;">` : `<div style="height:80px"></div>`;
    const logoHtml = currentEtab.logo_url ? `<img src="${currentEtab.logo_url}" style="max-height:80px;">` : `<div style="height:80px;width:80px;background:#f8f9fa;display:inline-block;border-radius:50%"></div>`;

    // Affichage Premium
    const container = document.getElementById('printableBulletin');
    container.innerHTML = `
        <div class="bulletin-header d-flex justify-content-between align-items-center mb-4 pb-3" style="border-bottom: 2px solid #1e293b;">
            <div class="text-center" style="flex:1">
                <h6 class="fw-bold text-uppercase m-0">République du Cameroun</h6>
                <p class="small text-muted m-0">Paix - Travail - Patrie</p>
                <div class="mt-2 text-uppercase fw-bold text-primary" style="font-size: 1.1rem">${currentEtab.nom}</div>
                <p class="small m-0">${currentEtab.devise || ''}</p>
                <p class="small m-0">${currentEtab.adresse} | Tél: ${currentEtab.tel}</p>
            </div>
            <div class="text-center mx-4">
                ${logoHtml}
            </div>
            <div class="text-center" style="flex:1">
                <h6 class="fw-bold text-uppercase m-0">Republic of Cameroon</h6>
                <p class="small text-muted m-0">Peace - Work - Fatherland</p>
                <div class="mt-2 text-uppercase fw-bold" style="font-size: 1.2rem">BULLETIN DE NOTES</div>
                <div class="badge bg-primary text-white p-2 mt-1" style="font-size: 0.9rem">${pNom}</div>
            </div>
        </div>
        
        <div class="bulletin-student-info bg-light p-3 rounded-3 mb-4 d-flex justify-content-between border">
            <div>
                <div class="text-muted small text-uppercase fw-bold mb-1">Nom de l'élève</div>
                <h5 class="fw-bold m-0">${eleve.nom} ${eleve.prenom}</h5>
            </div>
            <div>
                <div class="text-muted small text-uppercase fw-bold mb-1">Matricule</div>
                <div class="fw-medium">${eleve.matricule}</div>
            </div>
            <div>
                <div class="text-muted small text-uppercase fw-bold mb-1">Classe</div>
                <div class="fw-medium">${eleve.classes ? eleve.classes.nom : ''}</div>
            </div>
            <div>
                <div class="text-muted small text-uppercase fw-bold mb-1">Année Scolaire</div>
                <div class="fw-medium">2025-2026</div>
            </div>
        </div>
        
        <table class="bulletin-table table table-bordered table-sm align-middle text-center" style="font-size: 0.9rem">
            <thead class="table-light">
                <tr>
                    <th class="text-start" style="width:25%">Matière</th>
                    <th style="width:5%">Coef</th>
                    ${headerSeqHtml}
                    <th style="width:10%">Moyenne (/20)</th>
                    <th style="width:10%">Total Points</th>
                    <th class="text-start" style="width:30%">Appréciation / Observation</th>
                </tr>
            </thead>
            <tbody>
                ${rowsHtml}
            </tbody>
        </table>
        
        <div class="bulletin-summary bg-light p-3 rounded-3 mt-4 border">
            <div class="row text-center">
                <div class="col">
                    <div class="text-muted small fw-bold text-uppercase">Total Points</div>
                    <div class="fs-5 fw-bold">${totalPoints.toFixed(2)}</div>
                </div>
                <div class="col">
                    <div class="text-muted small fw-bold text-uppercase">Total Coefs</div>
                    <div class="fs-5 fw-bold">${totalCoefs.toFixed(2)}</div>
                </div>
                <div class="col border-start border-end">
                    <div class="text-muted small fw-bold text-uppercase">Moyenne Générale</div>
                    <div class="fs-3 fw-bold ${moyenneGenerale >= 10 ? 'text-success' : 'text-danger'}">${moyenneGenerale.toFixed(2)} <small class="text-muted" style="font-size:1rem">/20</small></div>
                </div>
                <div class="col border-end">
                    <div class="text-muted small fw-bold text-uppercase">Mention</div>
                    <div class="fs-5 fw-bold">${mention}</div>
                </div>
                <div class="col">
                    <div class="text-muted small fw-bold text-uppercase">Décision du conseil</div>
                    <div class="fs-5 fw-bold ${moyenneGenerale >= 10 ? 'text-success' : 'text-danger'}">${decision}</div>
                </div>
            </div>
        </div>
        
        <div class="bulletin-footer d-flex justify-content-between mt-5 pt-3">
            <div class="signature-box text-center" style="width: 250px">
                <div class="fw-bold mb-4">Le Titulaire de la classe</div>
                <div style="border-bottom: 1px dotted #ccc; height: 60px;"></div>
            </div>
            <div class="signature-box text-center" style="width: 250px">
                <div class="fw-bold">${currentEtab.titre_directeur || "Le Chef d'Établissement"}</div>
                <div class="small text-muted mb-2">${currentEtab.nom_directeur || ""}</div>
                ${sigDir}
            </div>
        </div>
    `;
    
    document.getElementById('bulletinPreviewContainer').classList.remove('d-none');
    
    // Vérifier si le bulletin existe déjà et son statut
    const {data: existingB} = await window.supabase.from('bulletins').select('id, statut').eq('eleve_id', eid).eq('periode_id', pid).maybeSingle();
    const btnValider = document.getElementById('btnValider');
    const btnPublier = document.getElementById('btnPublier');
    
    // RBAC: Show/Hide Publier button
    let userRole = '';
    const sessionStr = localStorage.getItem('edu_session');
    if (sessionStr) {
        try {
            const session = JSON.parse(sessionStr);
            userRole = (session.role || '').toLowerCase();
        } catch(e){}
    }
    const isAdminOrDirection = (userRole === 'admin' || userRole === 'direction' || userRole === 'superadmin');
    if (isAdminOrDirection && btnPublier) {
        btnPublier.classList.remove('d-none');
    }

    // Reset styles
    btnValider.className = 'btn btn-warning rounded-pill px-4 text-dark fw-bold';
    btnValider.innerHTML = '<i class="fas fa-check-circle me-1"></i>Valider le bulletin';
    btnValider.disabled = false;
    if (btnPublier) {
        btnPublier.className = 'btn btn-success rounded-pill px-4 fw-bold' + (isAdminOrDirection ? '' : ' d-none');
        btnPublier.innerHTML = '<i class="fas fa-paper-plane me-1"></i>Publier';
        btnPublier.disabled = false;
    }

    if (existingB && existingB.statut === 'Publié') {
        btnValider.className = 'btn btn-secondary rounded-pill px-4 fw-bold';
        btnValider.innerHTML = '<i class="fas fa-check-double me-1"></i>Déjà publié';
        btnValider.disabled = true;
        if (btnPublier) {
            btnPublier.className = 'btn btn-secondary rounded-pill px-4 fw-bold' + (isAdminOrDirection ? '' : ' d-none');
            btnPublier.innerHTML = '<i class="fas fa-check-double me-1"></i>Publié';
            btnPublier.disabled = true;
        }
    } else if(existingB && existingB.statut === 'Validé') {
        btnValider.className = 'btn btn-success rounded-pill px-4 fw-bold';
        btnValider.innerHTML = '<i class="fas fa-check-double me-1"></i>Bulletin déjà validé';
        btnValider.disabled = true;
    }
}

async function validerBulletin() {
    if(!generatedData) return;
    
    generatedData.statut = 'Validé';
    const btn = document.getElementById('btnValider');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Validation...';
    
    const { error } = await window.supabase.from('bulletins').upsert({
        ...generatedData,
        updated_at: new Date().toISOString()
    }, { onConflict: 'eleve_id, periode_id' });
    
    if(error) {
        alert("Erreur lors de la validation: " + error.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle me-1"></i>Valider le bulletin';
    } else {
        btn.className = 'btn btn-success rounded-pill px-4 fw-bold';
        btn.innerHTML = '<i class="fas fa-check-double me-1"></i>Bulletin Validé';
    }
}

async function publierBulletin() {
    if(!generatedData) return;
    
    generatedData.statut = 'Publié';
    const btn = document.getElementById('btnPublier');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Publication...';
    
    const { error } = await window.supabase.from('bulletins').upsert({
        ...generatedData,
        updated_at: new Date().toISOString()
    }, { onConflict: 'eleve_id, periode_id' });
    
    if(error) {
        alert("Erreur lors de la publication: " + error.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane me-1"></i>Publier';
    } else {
        btn.className = 'btn btn-secondary rounded-pill px-4 fw-bold';
        btn.innerHTML = '<i class="fas fa-check-double me-1"></i>Bulletin Publié';
    }
}

window.exporterPDF = function() {
    const element = document.getElementById('printableBulletin');
    
    const opt = {
        margin:       [10, 10, 10, 10],
        filename:     `Bulletin_${currentEleveData.nom}_${currentEleveData.prenom}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    
    html2pdf().set(opt).from(element).save();
}

document.addEventListener('DOMContentLoaded', () => {
    setTimeout(initBulletins, 500);
});
</script>
